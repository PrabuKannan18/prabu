<section id="contact" class="max-w-6xl mx-auto px-6 pt-6 pb-12 reveal space-y-8">
  <!-- Minimalist Header -->
  <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-white/5 pb-6">
    <div class="space-y-1">
      <h2 class="text-primary font-bold tracking-[0.2em] uppercase text-[9px]">Communication Hub</h2>
      <h1 class="text-3xl md:text-5xl font-black tracking-tighter text-main">Let's <span class="text-gradient">Connect</span></h1>
    </div>
    <p class="text-muted max-w-[300px] text-[10px] font-bold uppercase tracking-widest leading-relaxed">
      Ready to architect high-performance front-end solutions for your next enterprise venture.
    </p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <!-- Quick Access Matrix: Ultra-Tight -->
    <div class="lg:col-span-4 space-y-4">
      <div class="glass-card p-6 space-y-6 shadow-premium border-l-4 border-primary">
        <div class="space-y-4">
          <a href="mailto:prabukannanofficial@gmail.com" class="flex items-center gap-4 group">
            <div class="h-10 w-10 glass rounded-xl flex items-center justify-center shadow-glow group-hover:scale-110 transition-all text-primary">
              <i class="fa-solid fa-envelope text-lg"></i>
            </div>
            <div class="flex-1 overflow-hidden">
               <p class="text-[9px] font-black uppercase tracking-widest text-muted">Direct Email</p>
               <p class="text-[11px] font-bold text-main truncate">prabukannanofficial&#64;gmail.com</p>
            </div>
          </a>
          
          <a href="tel:+919360212949" class="flex items-center gap-4 group">
            <div class="h-10 w-10 glass rounded-xl flex items-center justify-center shadow-glow group-hover:scale-110 transition-all text-[#3880FF]">
              <i class="fa-solid fa-phone text-lg"></i>
            </div>
            <div>
               <p class="text-[9px] font-black uppercase tracking-widest text-muted">Voice Hub</p>
               <p class="text-[11px] font-bold text-main">+91 9360212949</p>
            </div>
          </a>
          
          <div class="flex items-center gap-4 group">
            <div class="h-10 w-10 glass rounded-xl flex items-center justify-center shadow-glow text-orange-500">
              <i class="fa-solid fa-location-dot text-lg"></i>
            </div>
            <div>
               <p class="text-[9px] font-black uppercase tracking-widest text-muted">Geographic Hub</p>
               <p class="text-[11px] font-bold text-main">Tamil Nadu, India</p>
            </div>
          </div>
        </div>
      </div>

      <div class="glass-card p-6 flex justify-between items-center shadow-premium bg-white/[0.01]">
         <div class="flex gap-4">
            <a href="https://github.com/PrabuKannan18" class="text-muted hover:text-main transition-colors"><i class="fa-brands fa-github text-xl"></i></a>
            <a href="https://www.linkedin.com/in/prabu-kannan-986b5827b" class="text-muted hover:text-[#3880FF] transition-colors"><i class="fa-brands fa-linkedin text-xl"></i></a>
            <a href="https://www.instagram.com/p_r_a_b_u_2_k_2" class="text-muted hover:text-rose-500 transition-colors"><i class="fa-brands fa-instagram text-xl"></i></a>
         </div>
         <span class="text-[9px] font-black uppercase tracking-widest text-muted">Social Matrix</span>
      </div>
    </div>

    <!-- Transmission Terminal -->
    <div class="lg:col-span-8">
      <div class="glass-card p-6 md:p-8 shadow-premium border-white/5 relative overflow-hidden group">
        <form #contactForm="ngForm" action="https://formsubmit.co/prabukannanofficial@gmail.com" method="POST" (ngSubmit)="sendMessage(contactForm)" class="space-y-6 relative z-10 font-sans">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label class="text-muted text-[9px] font-black uppercase tracking-[0.15em] ml-2">Your Signature</label>
              <input type="text" name="name" [(ngModel)]="formData.name" required
                     class="w-full glass-input rounded-xl px-5 py-4 text-xs placeholder:text-muted/40 focus:outline-none"
                     placeholder="Full Identity">
            </div>
            <div class="space-y-2">
              <label class="text-muted text-[9px] font-black uppercase tracking-[0.15em] ml-2">Return Link</label>
              <input type="email" name="email" [(ngModel)]="formData.email" required
                     class="w-full glass-input rounded-xl px-5 py-4 text-xs placeholder:text-muted/40 focus:outline-none"
                     placeholder="email-address&#64;provider.com">
            </div>
          </div>

          <div class="space-y-2">
            <label class="text-muted text-[9px] font-black uppercase tracking-[0.15em] ml-2">Project Brief</label>
            <textarea name="message" [(ngModel)]="formData.message" rows="4" required
                      class="w-full glass-input rounded-2xl px-5 py-5 text-xs placeholder:text-muted/40 resize-none focus:outline-none"
                      placeholder="Detailed specifications or inquiries..."></textarea>
          </div>

          <button type="submit" [disabled]="!contactForm.valid"
                  class="w-full py-4.5 bg-primary text-white font-black text-[10px] uppercase tracking-[0.3em] rounded-xl shadow-glow hover:bg-primary-dark transition-all disabled:opacity-20 active:scale-95 group/btn flex items-center justify-center gap-3">
            Initiate Contact
            <i class="fa-solid fa-paper-plane group-hover/btn:translate-x-1.5 transition-transform text-xs"></i>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
