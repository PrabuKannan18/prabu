<nav 
  class="fixed top-0 left-0 w-full z-[100] transition-all duration-300"
  [ngClass]="{
    'navbar-scrolled backdrop-blur-xl shadow-md': isScrolled,
    'bg-transparent border-b border-transparent': !isScrolled
  }">
  <div class="max-w-7xl mx-auto px-6 lg:px-10 py-4 flex justify-between items-center">
    
    <!-- Brand Logo -->
    <a 
      (click)="scrollTo('home')" 
      href="#home"
      class="text-2xl font-black uppercase tracking-tighter group flex items-center gap-2.5 cursor-pointer select-none">
      <div class="h-9 w-9 bg-gradient-to-tr from-purple-600 to-cyan-500 rounded-xl flex items-center justify-center text-white shadow-glow group-hover:rotate-12 transition-transform duration-500 font-display">
        P
      </div>
      <span class="text-main group-hover:text-primary transition-all duration-300 font-display font-extrabold tracking-tight">
        RABU<span class="text-cyan-500 dark:text-cyan-400">.</span>
      </span>
    </a>

    <!-- Desktop Navigation -->
    <div class="hidden lg:flex items-center gap-8">
      <ul class="flex items-center gap-1.5 p-1 rounded-full glass border border-slate-200 dark:border-white/10 backdrop-blur-md">
        
        <li>
          <a 
            (click)="scrollTo('home')"
            href="#home" 
            [class.nav-active]="activeSection === 'home'"
            class="nav-link px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-[0.2em] transition-all duration-300 inline-block">
            Home
          </a>
        </li>

        <li>
          <a 
            (click)="scrollTo('about')"
            href="#about" 
            [class.nav-active]="activeSection === 'about'"
            class="nav-link px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-[0.2em] transition-all duration-300 inline-block">
            About
          </a>
        </li>

        <li>
          <a 
            (click)="scrollTo('skills')"
            href="#skills" 
            [class.nav-active]="activeSection === 'skills'"
            class="nav-link px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-[0.2em] transition-all duration-300 inline-block">
            Skills
          </a>
        </li>

        <li>
          <a 
            (click)="scrollTo('projects')"
            href="#projects" 
            [class.nav-active]="activeSection === 'projects'"
            class="nav-link px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-[0.2em] transition-all duration-300 inline-block">
            Projects
          </a>
        </li>

        <li>
          <a 
            (click)="scrollTo('contact')"
            href="#contact" 
            [class.nav-active]="activeSection === 'contact'"
            class="nav-link px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-[0.2em] transition-all duration-300 inline-block">
            Contact
          </a>
        </li>

      </ul>

      <!-- Theme Switcher -->
      <button 
        (click)="toggleTheme()" 
        aria-label="Toggle light and dark theme"
        class="h-10 w-10 glass rounded-xl flex items-center justify-center hover:shadow-glow transition-all active:scale-90 border-slate-200 dark:border-white/10 group/toggle">
        <div class="relative h-5 w-5 flex items-center justify-center">
          @if (currentTheme === 'dark') {
            <div class="animate-in fade-in zoom-in duration-300 text-cyan-400">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg>
            </div>
          } @else {
            <div class="animate-in fade-in zoom-in duration-300 text-amber-500">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </div>
          }
        </div>
      </button>
      
      <!-- Connect CTA -->
      <a 
        (click)="scrollTo('contact')"
        href="#contact" 
        class="px-6 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-[10px] font-black uppercase tracking-[0.2em] rounded-xl shadow-glow hover:translate-y-[-2px] transition-all active:scale-95 flex items-center gap-2 group">
        <span>Let's Connect</span>
        <svg class="w-3 h-3 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </a>
    </div>

    <!-- Mobile Controls -->
    <div class="flex items-center gap-3 lg:hidden">
      <!-- Theme Switcher -->
      <button 
        (click)="toggleTheme()" 
        aria-label="Toggle theme"
        class="h-10 w-10 glass rounded-xl flex items-center justify-center border-slate-200 dark:border-white/10 active:scale-90">
        @if (currentTheme === 'dark') {
          <svg class="w-4 h-4 text-cyan-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg>
        } @else {
          <svg class="w-4 h-4 text-amber-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        }
      </button>

      <!-- Hamburger Toggle -->
      <button 
        (click)="isMenuOpen = !isMenuOpen" 
        aria-label="Toggle navigation menu"
        class="h-10 w-10 glass rounded-xl flex items-center justify-center text-main border-slate-200 dark:border-white/10 active:scale-90">
        @if (!isMenuOpen) {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        } @else {
          <svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
        }
      </button>
    </div>

  </div>

  <!-- Mobile Drawer Menu -->
  @if (isMenuOpen) {
    <div class="lg:hidden absolute top-full left-0 w-full glass border-b border-slate-200 dark:border-white/10 shadow-2xl backdrop-blur-2xl animate-fade-in-up">
      <ul class="p-6 space-y-3">
        <li>
          <a 
            (click)="scrollTo('home')" 
            href="#home"
            [class.nav-mobile-active]="activeSection === 'home'"
            class="text-xs font-black uppercase tracking-[0.2em] block p-3 rounded-xl text-main hover:bg-slate-100 dark:hover:bg-white/5 transition-all">
            Home
          </a>
        </li>
        <li>
          <a 
            (click)="scrollTo('about')" 
            href="#about"
            [class.nav-mobile-active]="activeSection === 'about'"
            class="text-xs font-black uppercase tracking-[0.2em] block p-3 rounded-xl text-main hover:bg-slate-100 dark:hover:bg-white/5 transition-all">
            About
          </a>
        </li>
        <li>
          <a 
            (click)="scrollTo('skills')" 
            href="#skills"
            [class.nav-mobile-active]="activeSection === 'skills'"
            class="text-xs font-black uppercase tracking-[0.2em] block p-3 rounded-xl text-main hover:bg-slate-100 dark:hover:bg-white/5 transition-all">
            Skills
          </a>
        </li>
        <li>
          <a 
            (click)="scrollTo('projects')" 
            href="#projects"
            [class.nav-mobile-active]="activeSection === 'projects'"
            class="text-xs font-black uppercase tracking-[0.2em] block p-3 rounded-xl text-main hover:bg-slate-100 dark:hover:bg-white/5 transition-all">
            Projects
          </a>
        </li>
        <li>
          <a 
            (click)="scrollTo('contact')" 
            href="#contact"
            [class.nav-mobile-active]="activeSection === 'contact'"
            class="text-xs font-black uppercase tracking-[0.2em] block p-3 rounded-xl text-main hover:bg-slate-100 dark:hover:bg-white/5 transition-all">
            Contact
          </a>
        </li>
        <li class="pt-2 border-t border-slate-200 dark:border-white/10">
          <a 
            (click)="scrollTo('contact')" 
            href="#contact"
            class="block w-full text-center py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-black uppercase tracking-[0.2em] rounded-xl shadow-glow">
            Let's Connect →
          </a>
        </li>
      </ul>
    </div>
  }
</nav>
